# Cloud Run backend has no fixed IP, so re-resolve its DNS at request time
# rather than once at nginx startup (proxy_pass with a variable forces this).
resolver 8.8.8.8 valid=300s;
resolver_timeout 5s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Deployed backend Cloud Run service (nasa-mission-backend, us-central1).
    # Update this if the backend is ever redeployed under a new URL.
    set $backend_host nasa-mission-backend-xmwamp26ba-uc.a.run.app;

    # Strip the /api prefix so the backend's routes stay bare (/query,
    # /missions, /health) regardless of the public path scheme.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass https://$backend_host;
        proxy_ssl_server_name on;
        proxy_ssl_name $backend_host;
        proxy_set_header Host $backend_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
